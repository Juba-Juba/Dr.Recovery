<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#126E66">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dr. Recovery — إدارة مراكز العلاج الطبيعي والتأهيل الطبي.">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body { margin: 0; min-height: 100%; background: #f5faf8; }
    #startup-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #174a46;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    #startup-splash .brand { font-size: 1.5rem; font-weight: 700; }
    #startup-splash .loading { margin-top: 14px; line-height: 1.6; }
    #startup-splash .spinner {
      width: 30px;
      height: 30px;
      margin: 22px auto 0;
      border: 3px solid #c6e5df;
      border-top-color: #126e66;
      border-radius: 50%;
      animation: startup-spin 0.8s linear infinite;
    }
    #startup-splash .slow { display: none; margin-top: 20px; font-size: 0.9rem; }
    #startup-splash.slow-start .slow { display: block; }
    #startup-splash button {
      margin-top: 10px;
      padding: 9px 18px;
      border: 1px solid #126e66;
      border-radius: 8px;
      background: #fff;
      color: #126e66;
      font: inherit;
      cursor: pointer;
    }
    @keyframes startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #startup-splash .spinner { animation: none; }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dr. Recovery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dr. Recovery</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup-splash" role="status" aria-live="polite">
    <div>
      <div class="brand">Dr. Recovery</div>
      <div class="loading">جارٍ تحميل التطبيق<br>Loading the application</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="slow">يستغرق التحميل وقتًا أطول من المعتاد — Loading is taking longer than usual.<br>
        <button type="button" onclick="location.reload()">إعادة المحاولة / Retry</button>
      </div>
    </div>
  </div>
  <script>
    const startupSplash = document.getElementById('startup-splash');
    const slowStartTimer = setTimeout(() => startupSplash?.classList.add('slow-start'), 15000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(slowStartTimer);
      startupSplash?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="passkeys_bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

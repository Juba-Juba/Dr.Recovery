<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base id="app-base" href="/">
  <script>
    (function () {
      var base = document.getElementById('app-base');
      if (location.hostname.toLowerCase() === 'juba-juba.github.io') {
        base.setAttribute('href', '/Dr.Recovery/');
      } else {
        base.setAttribute('href', '/');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#126E66">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dr. Recovery — إدارة مراكز العلاج الطبيعي والتأهيل الطبي.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dr. Recovery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dr. Recovery</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-loading" style="
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#F5F8F7;color:#126E66;font-family:Arial,sans-serif;z-index:999999;
    text-align:center;padding:24px">
    <div>
      <div style="font-size:28px;font-weight:700;margin-bottom:10px">Dr. Recovery</div>
      <div id="app-loading-text" style="font-size:15px">جاري تحميل البرنامج...</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });

    window.addEventListener('error', function (e) {
      var t = document.getElementById('app-loading-text');
      if (t) t.textContent = 'تعذر تشغيل التطبيق. حدّث الصفحة مرة أخرى.';
      console.error('Dr. Recovery startup error:', e.error || e.message || e);
    });

    window.addEventListener('unhandledrejection', function (e) {
      var t = document.getElementById('app-loading-text');
      if (t) t.textContent = 'تعذر تشغيل التطبيق. حدّث الصفحة مرة أخرى.';
      console.error('Dr. Recovery unhandled promise rejection:', e.reason || e);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
